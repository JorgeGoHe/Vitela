[package]
name = "vitela"
version = "0.4.0"
description = "Vitela — visor y editor de PDF de escritorio"
authors = ["Jorge"]
edition = "2021"
# hay dos binarios (Vitela y el puente de QA): cargo run necesita saber
# cuál es el de la app
default-run = "Vitela"

# el binario se llama Vitela (con mayúscula) para que el dock lo muestre
# bien también en desarrollo; en producción manda productName
[[bin]]
name = "Vitela"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vitela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.8"
image = "0.25"
base64 = "0.22"
# firma digital (paso 7): PKCS#7 detached sobre ByteRange
lopdf = "0.34"
cms = { version = "0.2", features = ["builder"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
x509-cert = { version = "0.2", features = ["pem"] }
# verificación de firmas ajenas: ECDSA P-256 y P-384 (las de las firmas
# cualificadas modernas), además del RSA con el que firma Vitela
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
der = "0.7"
const-oid = { version = "0.9", features = ["db"] }
chrono = "0.4"
p12-keystore = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
getrandom = "0.2"
# puente HTTP de QA (el código solo se compila en debug)
tiny_http = "0.12"
docx-rs = "0.4.22"
# XFDF: XML plano, para exportar e importar comentarios (ya venía en el
# árbol con docx-rs, así que no trae nada nuevo al build)
quick-xml = "0.41"

# cadena de confianza de las firmas (ciclo 5): las raíces las pone el
# sistema, no Vitela. En macOS las evalúa el propio llavero; en Windows y
# Linux se leen del almacén nativo y la cadena se comprueba con el mismo
# código que ya verifica las firmas (RustCrypto), sin traerse ring ni un
# ensamblador nuevo al build de Windows.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
# solo para abrir el .docx en el test de export_docx y leer su XML
zip = { version = "8", default-features = false, features = ["deflate"] }
